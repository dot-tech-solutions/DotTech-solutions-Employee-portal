<svg viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="arcGrad" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%"   stop-color="#1E90FF"/>
      <stop offset="100%" stop-color="#7B2FBE"/>
    </linearGradient>
  </defs>

  <!-- Dark navy background -->
  <rect width="100" height="100" fill="#0A0E1A"/>

  <!-- ── T letter (white) ─────────────────────── -->
  <!-- Crossbar -->
  <rect x="26" y="35" width="42" height="9" rx="3" fill="white"/>
  <!-- Stem -->
  <rect x="35" y="44" width="9"  height="30" rx="3" fill="white"/>

  <!-- ── D arc (gradient stroke, open on left) ── -->
  <!--
    Starts at right end of T crossbar (x=65, y=39.5 = vertical midpoint of crossbar),
    curves outward to the right, ends near bottom of T stem.
  -->
  <path
    d="M 65 39.5
       C 84 39.5  84 74   62 74"
    stroke="url(#arcGrad)"
    stroke-width="9"
    stroke-linecap="round"
    fill="none"
  />
</svg>
